spring.application.name=backend

# Configura\u00e7\u00e3o da conex\u00e3o com o Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/domus_db
spring.datasource.username=
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Ativa o baseline autom\u00e1tico se o banco n\u00e3o estiver vazio e n\u00e3o tiver a tabela do Flyway

api.security.tokenJWT.segredo=${JWT_SEGREDO:}

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.servlet.context-path=/api

# Configura\u00e7\u00e3o do Servi\u00e7o de Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# MinIO
minio.url=http://localhost:9000
minio.bucket-name-encomenda=encomendas
minio.bucket-name-pessoa=pessoas
minio.bucket-name-aviso=avisos
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}