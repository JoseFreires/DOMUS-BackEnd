spring.application.name=backend

# Configuração da conexão com o Banco de Dados
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME_MYSQL:domus_db}
spring.datasource.username=${DB_USER_MYSQL:root}
spring.datasource.password=${DB_PASSWORD_MYSQL:1234567}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Ativa o baseline autom\u00e1tico se o banco n\u00e3o estiver vazio e n\u00e3o tiver a tabela do Flyway

api.security.tokenJWT.segredo=${JWT_SEGREDO:1234567}

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.servlet.context-path=/api

# Configuração do Serviço de Email
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.remetente=domus.sistema.condominio@gmail.com