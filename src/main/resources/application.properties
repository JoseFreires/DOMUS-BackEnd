spring.application.name=backend

# Configura\u00e7\u00e3o da conex\u00e3o com o Banco de Dados
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME_MYSQL}
spring.datasource.username=${DB_USER_MYSQL}
spring.datasource.password=${DB_PASSWORD_MYSQL}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Ativa o baseline autom\u00e1tico se o banco n\u00e3o estiver vazio e n\u00e3o tiver a tabela do Flyway

api.security.tokenJWT.segredo=${JWT_SEGREDO:1234567}

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.servlet.context-path=/api

# Configura\u00e7\u00e3o do Servi\u00e7o de Email
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.remetente=domus.sistema.condominio@gmail.com

# MinIO
minio.url=http://localhost:9000
minio.bucket-name-encomenda=encomendas
minio.bucket-name-pessoa=pessoas
minio.access-key=minioadmin
minio.secret-key=minioadmin